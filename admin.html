<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Portal Gamestudio</title>
  <style>
    :root {
      --bg-primary: #121214;
      --bg-card: #1a1a1e;
      --border-color: #2e2e38;
      --accent-color: #00ff88;
      --text-main: #ffffff;
      --text-muted: #a0a0b0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .admin-container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .header-admin {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .config-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .table-products {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .table-products th, .table-products td {
      border: 1px solid var(--border-color);
      padding: 10px;
      text-align: left;
    }

    .table-products th {
      background-color: #222228;
    }

    .btn-small {
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--accent-color);
      color: #000;
      padding: 10px 20px;
      border-radius: 5px;
      font-weight: bold;
      display: none;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="header-admin">
      <h2>⚙️ Panel de Administración - Portal Gamestudio</h2>
      <a href="index.html" style="color: var(--accent-color); text-decoration: none; font-weight: bold;">← Volver a la Tienda</a>
    </div>

    <!-- Sección de Historial de Pedidos -->
    <div class="config-box">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 15px;">
        <h3>📦 Historial de Pedidos</h3>
        <div>
          <button class="btn-small" style="background: var(--border-color); color: #fff; border:none;" onclick="exportarPedidosJSON()">📥 Exportar Pedidos</button>
          <button class="btn-small" style="background: var(--accent-color); color: #000; border:none; font-weight:bold;" onclick="cargarPedidosUI()">🔄 Refrescar</button>
        </div>
      </div>

      <div style="overflow-x: auto;">
        <table class="table-products" style="font-size: 0.85rem;">
          <thead>
            <tr>
              <th>ID / Fecha</th>
              <th>Cliente / Teléfono</th>
              <th>Detalles del Pedido</th>
              <th>Total</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="admin-pedidos-list">
            <!-- Carga dinámicamente -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Sección de Gestión de Productos -->
    <div class="config-box">
      <h3>🎮 Inventario de Productos</h3>
      <div style="display: flex; justify-content: flex-end; margin-bottom: 10px;">
        <button class="btn-small" style="background: var(--accent-color); color: #000; font-weight: bold; border: none;" onclick="agregarNuevoProductoModal()">+ Añadir Producto</button>
      </div>
      <div style="overflow-x: auto;">
        <table class="table-products">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Modalidad</th>
              <th>Precio (USD)</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="admin-productos-list">
            <!-- Carga dinámicamente -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="toast-msg" class="toast"></div>

  <script src="admin.js"></script>
</body>
</html>
