<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Gamestudio - Catálogo</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-container">
      <div class="logo">
        <span class="logo-icon">🎮</span> PORTAL <span>GAMESTUDIO</span>
      </div>
      <div class="header-actions">
        <button class="cart-btn" onclick="toggleCart()">
          🛒 Cesta <span id="cart-count">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="container">
    
    <!-- BARRA DE BÚSQUEDA Y FILTROS -->
    <section class="controls">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Buscar juego o servicio..." oninput="filterProducts()">
      </div>
      <div class="categories">
        <!-- Generado dinámicamente -->
      </div>
    </section>

    <!-- GRILLA DE PRODUCTOS -->
    <section id="product-grid" class="grid">
      <!-- Generado dinámicamente -->
    </section>

  </main>

  <!-- MODAL / MODAL CESTA DE COMPRAS -->
  <div id="cart-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2>🛒 Tu Cesta de Compras</h2>
        <button class="close-btn" onclick="toggleCart()">✕</button>
      </div>

      <div class="modal-body">
        <ul id="cart-items" class="cart-list">
          <!-- Elementos de la cesta -->
        </ul>

        <div class="cart-summary">
          <p>Total USD: <strong>$<span id="cart-total-usd">0</span> USD</strong></p>
          <div id="cup-conversion-box" class="conversion-box">
            <p>Total en CUP: <strong><span id="cart-total-cup">0</span> CUP</strong></p>
          </div>
        </div>

        <hr>

        <h3>📋 Datos del Pedido</h3>
        <form id="order-form" onsubmit="event.preventDefault(); sendWhatsAppOrder();">
          <div class="form-group">
            <label for="client-name">Nombre completo *</label>
            <input type="text" id="client-name" required placeholder="Tu nombre">
          </div>

          <div class="form-group">
            <label for="client-phone">Teléfono de contacto *</label>
            <input type="tel" id="client-phone" required placeholder="Ej. 52890559">
          </div>

          <div class="form-group">
            <label for="delivery-type">Tipo de entrega</label>
            <select id="delivery-type" onchange="toggleDeliveryAddress()">
              <option value="Digital / Remoto">Digital / En tienda</option>
              <option value="Domicilio">Entrega a domicilio</option>
            </select>
          </div>

          <div class="form-group" id="address-group" style="display: none;">
            <label for="client-address">Dirección exacta</label>
            <textarea id="client-address" rows="2" placeholder="Dirección para la entrega"></textarea>
          </div>

          <div class="form-group">
            <label for="payment-method">Método de pago</label>
            <select id="payment-method" onchange="toggleExchangeRateInput()">
              <option value="Efectivo USD">Efectivo USD</option>
              <option value="Transferencia CUP">Transferencia CUP</option>
              <option value="Efectivo CUP">Efectivo CUP</option>
              <option value="USD Digital">USD Digital (MLC / Zelle)</option>
            </select>
          </div>

          <button type="submit" class="btn-checkout">📱 Confirmar por WhatsApp</button>
        </form>
      </div>
    </div>
  </div>

  <!-- NOTIFICACIONES TOAST -->
  <div id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
