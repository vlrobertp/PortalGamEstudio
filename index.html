<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal GamEstudio | Tienda de Videojuegos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="header-container">
      <h1>🎮 Portal GamEstudio</h1>
      <div class="cart-btn" onclick="toggleCart()">
        🛒 Cesta (<span id="cart-count">0</span>)
      </div>
    </div>
  </header>

  <main class="main-container">
    <!-- Buscador y Filtros por Categoría -->
    <section class="controls">
      <input type="text" id="search-input" placeholder="🔍 Buscar juego o servicio..." onkeyup="filterProducts()">
      <div class="categories">
        <button class="cat-btn active" onclick="filterCategory('todos')">Todos</button>
        <button class="cat-btn" onclick="filterCategory('ps5')">PS5</button>
        <button class="cat-btn" onclick="filterCategory('ps4')">PS4</button>
        <button class="cat-btn" onclick="filterCategory('xbox')">Xbox</button>
        <button class="cat-btn" onclick="filterCategory('pirateria_ps5')">Piratería PS5</button>
        <button class="cat-btn" onclick="filterCategory('pirateria_ps4')">Piratería PS4</button>
        <button class="cat-btn" onclick="filterCategory('perifericos')">Accesorios / Discos</button>
        <button class="cat-btn" onclick="filterCategory('servicios')">Servicios Técnicos</button>
      </div>
    </section>

    <!-- Catálogo de Productos -->
    <section id="product-grid" class="product-grid">
      <!-- Los productos se cargan dinámicamente -->
    </section>
  </main>

  <!-- Modal del Carrito de Compras -->
  <div id="cart-modal" class="cart-modal">
    <div class="cart-content">
      <h2>Tu Pedido</h2>
      <ul id="cart-items" class="cart-list"></ul>
      
      <!-- Desglose de Totales -->
      <div class="cart-total">
        <div style="font-size: 1.3rem;">Total: <strong>$<span id="cart-total-usd">0</span> USD</strong></div>
        <div id="cup-conversion-box" style="display: none; margin-top: 5px; color: #00ff88; font-weight: bold;">
          Equivalente a pagar: <span id="cart-total-cup">0</span> CUP
        </div>
      </div>

      <div class="form-group">
        <label>Tipo de Entrega:</label>
        <select id="delivery-type" onchange="toggleDeliveryAddress()">
          <option value="Tienda / Digital">En Tienda / Entrega Digital</option>
          <option value="Domicilio">Envío a Domicilio</option>
        </select>

        <!-- Campo de Dirección (Solo visible si selecciona Domicilio) -->
        <div id="address-group" style="display: none; margin-top: 10px;">
          <label>Dirección de entrega (La Habana):</label>
          <input type="text" id="client-address" placeholder="Ej: Calle 31 #4205 e/ 42 y 44, Marianao">
        </div>

        <label style="margin-top: 10px;">Moneda y Método de Pago:</label>
        <select id="payment-method" onchange="toggleExchangeRateInput()">
          <option value="USD - Efectivo">Efectivo en USD ($)</option>
          <option value="CUP - Transferencia">Transferencia en CUP (Transfermóvil / EnZona)</option>
          <option value="CUP - Efectivo">Efectivo en CUP</option>
        </select>

        <label style="margin-top: 10px;">Nombre completo:</label>
        <input type="text" id="client-name" placeholder="Ej: Carlos Pérez">
        
        <label>Teléfono de contacto:</label>
        <input type="tel" id="client-phone" placeholder="Ej: 5351234567">
      </div>

      <button class="btn-whatsapp" onclick="sendWhatsAppOrder()">📲 Enviar Pedido por WhatsApp</button>
      <button class="btn-close" onclick="toggleCart()">Cerrar</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
